<!DOCTYPE html>
<html lang="es" data-theme="rise">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="description" content="Rise - Tu vida es el juego">
  
  <title>Rise · Tu vida es el juego</title>
  
  <!-- Icons -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%23f97316' width='180' height='180'/><text x='50%' y='50%' font-size='100' font-weight='bold' fill='white' text-anchor='middle' dominant-baseline='central'>R</text></svg>">
  
  <!-- Tabler Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
  
  <!-- CSS -->
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/components.css">
  
  <style>
    /* Estilos críticos para que funcione */
    .notification {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 20px;
      border-radius: 12px;
      background: var(--bg3);
      color: var(--text);
      font-size: 14px;
      z-index: 1000;
      box-shadow: var(--shadow-lg);
    }
    
    .notif-success { background: var(--success-bg); color: var(--success); }
    .notif-error { background: var(--danger-bg); color: var(--danger); }
    .notif-info { background: var(--accent-bg); color: var(--accent); }
    
    .modal-scrim {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    
    .modal-scrim.active {
      display: flex;
    }
    
    .modal-content {
      background: var(--bg2);
      padding: 24px;
      border-radius: var(--radius);
      max-width: 90%;
      max-height: 80vh;
      overflow-y: auto;
    }
    
    /* Screen container */
    #screen-container {
      flex: 1;
      overflow-y: auto;
      padding: var(--spacing-lg);
      padding-bottom: 80px;
    }
    
    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: var(--glass);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-top: 0.5px solid var(--glass-border);
      display: flex;
      justify-content: space-around;
      padding: 8px 0;
      padding-bottom: calc(8px + env(safe-area-inset-bottom));
      z-index: 100;
    }
    
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 8px 16px;
      color: var(--text-tertiary);
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .nav-item.active {
      color: var(--accent);
    }
    
    .nav-item i {
      font-size: 24px;
    }
    
    /* Welcome screen */
    .welcome-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 24px;
      text-align: center;
    }
    
    .welcome-icon {
      width: 120px;
      height: 120px;
      background: var(--accent);
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 32px;
      box-shadow: 0 10px 40px rgba(249, 115, 22, 0.4);
    }
    
    .welcome-icon i {
      font-size: 60px;
      color: white;
    }
    
    .welcome-title {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--text);
    }
    
    .welcome-subtitle {
      font-size: 16px;
      color: var(--text-secondary);
      margin-bottom: 40px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <!-- Contenedor dinámico para pantallas -->
    <div id="screen-container"></div>
    
    <!-- Navegación inferior (se mostrará después del login) -->
    <nav class="bottom-nav" id="bottom-nav" style="display: none;">
      <div class="nav-item active" onclick="navigateTo('dashboard')">
        <i class="ti ti-home"></i>
        <span>Inicio</span>
      </div>
      <div class="nav-item" onclick="navigateTo('habits')">
        <i class="ti ti-checks"></i>
        <span>Hábitos</span>
      </div>
      <div class="nav-item" onclick="navigateTo('missions')">
        <i class="ti ti-target"></i>
        <span>Misiones</span>
      </div>
      <div class="nav-item" onclick="navigateTo('evolution')">
        <i class="ti ti-chart-line"></i>
        <span>Evolución</span>
      </div>
      <div class="nav-item" onclick="navigateTo('profile')">
        <i class="ti ti-user"></i>
        <span>Perfil</span>
      </div>
    </nav>
  </div>
  
  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/state.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/components.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/screens/onboarding.js"></script>
  <script src="js/screens/dashboard.js"></script>
  <script src="js/screens/habits.js"></script>
  <script src="js/screens/missions.js"></script>
  <script src="js/screens/evolution.js"></script>
  <script src="js/screens/finance.js"></script>
  <script src="js/screens/diary.js"></script>
  <script src="js/screens/profile.js"></script>
  <script src="js/main.js"></script>
  
  <!-- Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
