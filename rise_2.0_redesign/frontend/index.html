<!DOCTYPE html>
<html lang="es" data-theme="rise">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="description" content="Rise 2.0 - Tu vida es el juego">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>Rise 2.0 · Tu vida es el juego</title>

  <!-- Icons -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%23f97316' width='180' height='180'/><text x='50%' y='50%' font-size='100' font-weight='bold' fill='white' text-anchor='middle' dominant-baseline='central'>R</text></svg>">

  <!-- Tabler Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">

  <!-- CSS -->
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="app" id="app">
    <!-- Loading State -->
    <div class="loading-screen" id="loading-screen">
      <div class="loading-logo">
        <div class="logo-circle">
          <span class="logo-letter">R</span>
        </div>
        <div class="loading-text">Rise</div>
      </div>
    </div>

    <!-- Contenedor dinámico para pantallas -->
    <div id="screen-container"></div>

    <!-- Bottom Sheet Container -->
    <div class="bottom-sheet-backdrop" id="sheet-backdrop" onclick="UI.closeSheet()"></div>
    <div class="bottom-sheet" id="bottom-sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-content" id="sheet-content"></div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Modal Container -->
    <div class="modal-backdrop" id="modal-backdrop" onclick="UI.closeModal(event)">
      <div class="modal-container" id="modal-container"></div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/state.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/components/base.js"></script>
  <script src="js/components/cards.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/features/xp.js"></script>
  <script src="js/features/habits.js"></script>
  <script src="js/features/missions.js"></script>
  <script src="js/features/finance.js"></script>
  <script src="js/screens/onboarding.js"></script>
  <script src="js/screens/dashboard.js"></script>
  <script src="js/screens/habits.js"></script>
  <script src="js/screens/evolution.js"></script>
  <script src="js/screens/profile.js"></script>
  <script src="js/screens/missions.js"></script>
  <script src="js/screens/finance.js"></script>
  <script src="js/screens/diary.js"></script>
  <script src="js/router.js"></script>
  <script src="js/main.js"></script>

  <!-- Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
